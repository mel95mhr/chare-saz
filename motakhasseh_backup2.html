<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چاره‌ساز | پنل متخصص</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--primary: #10b981;
--primary-dark: #059669;
--accent: #14b8a6;
--gold: #f59e0b;
--red: #ef4444;
--bg1: #04140a;
--bg2: #0a2618;
--bg3: #0f1f1a;
--glass: rgba(255,255,255,0.06);
--glass-border: rgba(255,255,255,0.1);
--text: #ffffff;
--text-muted: rgba(255,255,255,0.55);
--font: 'Vazirmatn', sans-serif;
--font-mult: 1;
}
html[data-theme="light"] {
--bg1: #f0fdf4; --bg2: #dcfce7; --bg3: #f0f4ff;
--glass: rgba(255,255,255,0.75); --glass-border: rgba(0,0,0,0.08);
--text: #1a1a2e; --text-muted: rgba(26,26,46,0.6);
}
html[data-font="small"] { --font-mult: 0.85; }
html[data-font="medium"] { --font-mult: 1; }
html[data-font="large"] { --font-mult: 1.15; }
html[data-font="xlarge"] { --font-mult: 1.35; }
html, body {
font-family: var(--font);
font-size: calc(15px * var(--font-mult));
background: radial-gradient(circle at 20% 0%, #064e3b 0%, transparent 50%),
radial-gradient(circle at 80% 100%, #065f46 0%, transparent 50%),
linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
background-attachment: fixed; min-height: 100vh; color: var(--text);
direction: rtl; overflow-x: hidden; position: relative; transition: background 0.4s, color 0.4s;
}
.glass {
background: var(--glass); backdrop-filter: blur(20px);
border: 1px solid var(--glass-border); border-radius: 20px;
box-shadow: 0 8px 32px rgba(0,0,0,0.3); padding: 18px; transition: all 0.35s;
}
.btn {
display: inline-flex; align-items: center; justify-content: center; gap: 8px;
padding: 13px 22px; border: none; border-radius: 14px; font-family: var(--font);
font-size: calc(15px * var(--font-mult)); font-weight: 700; cursor: pointer;
width: 100%; color: #fff; transition: all 0.3s;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(16,185,129,0.5); }
.btn-success { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
.btn-danger { background: linear-gradient(135deg, var(--red), #dc2626); }
.btn-outline { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--text); }
.btn-sm { padding: 9px 16px; font-size: calc(13px * var(--font-mult)); }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: calc(13px * var(--font-mult)); font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.input-group input, .input-group select, .input-group textarea {
width: 100%; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.12);
border-radius: 14px; background: rgba(255,255,255,0.05); color: var(--text);
font-family: var(--font); font-size: calc(15px * var(--font-mult)); outline: none; transition: all 0.3s;
}
.input-group input:focus, .input-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(16,185,129,0.15); }
.input-group textarea { resize: vertical; min-height: 80px; }
.toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 460px; width: 92%; pointer-events: none; }
.toast { padding: 14px 20px; border-radius: 16px; color: #fff; font-size: calc(14px * var(--font-mult)); font-weight: 600; backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); pointer-events: auto; display: flex; align-items: center; gap: 10px; animation: slideDown 0.4s; border: 1px solid rgba(255,255,255,0.15); }
.toast-success { background: rgba(16,185,129,0.95); }
.toast-error { background: rgba(239,68,68,0.95); }
.toast-warning { background: rgba(245,158,11,0.95); }
.toast-info { background: rgba(59,130,246,0.95); }
@keyframes slideDown { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
.auth-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; position: relative; z-index: 1; }
.auth-box { width: 100%; max-width: 420px; background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); padding: 32px 26px; }
.auth-box .logo { text-align: center; margin-bottom: 32px; }
.auth-box .logo-icon { font-size: 64px; margin-bottom: 8px; display: inline-block; animation: bounce 2s infinite ease-in-out; }
.auth-box .logo h1 { font-size: calc(42px * var(--font-mult)); font-weight: 900; background: linear-gradient(135deg, #fff 0%, #34d399 50%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -2px; margin-bottom: 4px; }
.auth-box .logo p { color: var(--text-muted); font-size: calc(14px * var(--font-mult)); }
.auth-tabs { display: flex; gap: 6px; margin-bottom: 24px; background: rgba(255,255,255,0.04); border-radius: 16px; padding: 5px; }
.auth-tabs button { flex: 1; padding: 12px; border: none; border-radius: 12px; background: transparent; color: var(--text-muted); font-family: var(--font); font-size: calc(14px * var(--font-mult)); font-weight: 700; cursor: pointer; transition: all 0.3s; }
.auth-tabs button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
.auth-form { display: none; }
.auth-form.active { display: block; }
.auth-footer { text-align: center; margin-top: 18px; color: var(--text-muted); font-size: calc(13px * var(--font-mult)); }
.auth-footer a { color: var(--primary); cursor: pointer; font-weight: 700; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
.dashboard { min-height: 100vh; padding: 20px; max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
.dash-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 24px; }
.dash-header h2 { font-size: calc(26px * var(--font-mult)); font-weight: 900; background: linear-gradient(90deg, var(--text), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.dash-avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: calc(20px * var(--font-mult)); color: #fff; box-shadow: 0 4px 15px rgba(16,185,129,0.4); cursor: pointer; }
.welcome-card { background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(20,184,166,0.15)); border: 1px solid rgba(16,185,129,0.25); border-radius: 24px; padding: 22px; margin-bottom: 20px; position: relative; overflow: hidden; }
.welcome-card::before { content: '🔧'; position: absolute; top: -20px; left: -20px; font-size: 100px; opacity: 0.15; transform: rotate(-20deg); }
.welcome-card h3 { font-size: calc(18px * var(--font-mult)); font-weight: 800; color: #fff; margin-bottom: 6px; }
.welcome-card p { font-size: calc(13px * var(--font-mult)); color: var(--text-muted); }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; text-align: center; }
.stat-value { font-size: calc(22px * var(--font-mult)); font-weight: 800; color: var(--gold); }
.stat-label { font-size: calc(11px * var(--font-mult)); color: var(--text-muted); margin-top: 4px; }
.gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.gallery-item { aspect-ratio: 1; border-radius: 12px; overflow: hidden; position: relative; background: rgba(255,255,255,0.05); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; }
.gallery-item .delete-btn { position: absolute; top: 4px; right: 4px; background: rgba(239,68,68,0.9); color: #fff; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
.upload-box { border: 2px dashed rgba(255,255,255,0.2); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; transition: all 0.3s; margin-top: 10px; display: block; }
.upload-box:hover { border-color: var(--primary); background: rgba(16,185,129,0.05); }
.upload-box input { display: none; }
</style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

<!-- صفحه ورود / ثبت‌نام -->
<div class="auth-page" id="authPage">
<div class="auth-box glass">
<div class="logo">
<div class="logo-icon">🔧</div>
<h1>پنل متخصص</h1>
<p>چاره‌ساز</p>
</div>

<div class="auth-tabs">
<button class="active" data-tab="login" onclick="switchTab('login')">ورود</button>
<button data-tab="register" onclick="switchTab('register')">ثبت‌نام</button>
</div>

<form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
<div class="input-group">
<label>ایمیل</label>
<input type="email" id="loginEmail" placeholder="example@mail.com" required>
</div>
<div class="input-group">
<label>رمز عبور</label>
<input type="password" id="loginPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6">
</div>
<button type="submit" class="btn btn-primary" id="loginBtn">ورود به پنل</button>
<div class="auth-footer">حساب ندارید؟ <a onclick="switchTab('register')">ثبت‌نام کنید</a></div>
</form>

<form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
<div class="input-group">
<label>نام و نام خانوادگی</label>
<input type="text" id="registerName" placeholder="مثلاً فریبا خلیلی" required>
</div>
<div class="input-group">
<label>ایمیل</label>
<input type="email" id="registerEmail" placeholder="example@mail.com" required>
</div>
<div class="input-group">
<label>رمز عبور</label>
<input type="password" id="registerPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6">
</div>
<div class="input-group">
<label>تکرار رمز عبور</label>
<input type="password" id="registerPasswordConfirm" placeholder="تکرار رمز" required>
</div>
<button type="submit" class="btn btn-success" id="registerBtn">ثبت‌نام</button>
<div class="auth-footer">قبلاً ثبت‌نام کردید؟ <a onclick="switchTab('login')">وارد شوید</a></div>
</form>
</div>
</div>

<!-- داشبورد متخصص -->
<div class="dashboard" id="dashboardPage" style="display:none;">
<div class="dash-header">
<div>
<h2>پنل متخصص</h2>
<p id="greetingText" style="font-size:12px; color:var(--text-muted);">خوش آمدید</p>
</div>
<div class="dash-avatar" id="userAvatar" onclick="showProfileModal()">م</div>
</div>

<div class="welcome-card">
<h3 id="welcomeName">خوش آمدید</h3>
<p>مدیریت سفارش‌ها و نمونه‌کارها</p>
</div>

<div class="stats-grid">
<div class="stat-card">
<div class="stat-value" id="statPending">۰</div>
<div class="stat-label">سفارش جدید</div>
</div>
<div class="stat-card">
<div class="stat-value" id="statIncome">۰</div>
<div class="stat-label">درآمد (تومان)</div>
</div>
<div class="stat-card">
<div class="stat-value" id="statDone">۰</div>
<div class="stat-label">انجام‌شده</div>
</div>
<div class="stat-card">
<div class="stat-value" id="statRating">-</div>
<div class="stat-label">امتیاز</div>
</div>
</div>

<!-- گالری نمونه‌کار -->
<div class="glass" style="margin-bottom:20px;">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
<h3 style="font-size:15px;">🖼️ گالری نمونه‌کار</h3>
<span style="font-size:11px; color:var(--text-muted);">(حداکثر ۶ عکس)</span>
</div>
<div class="gallery-grid" id="galleryGrid">
<!-- عکس‌ها اینجا لود می‌شوند -->
</div>
<label class="upload-box" for="galleryUpload" style="margin-top:12px;">
<div style="font-size:24px; margin-bottom:6px;">📷</div>
<div style="font-size:13px;">برای افزودن عکس کلیک کنید</div>
<input type="file" id="galleryUpload" accept="image/*" onchange="uploadGalleryImage(event)" style="display:none;">
</label>
</div>

<!-- فیلم تیزر -->
<div class="glass" style="margin-bottom:20px;">
<h3 style="font-size:15px; margin-bottom:10px;">🎬 فیلم تیزر</h3>
<div id="videoPreview" style="margin-bottom:10px;"></div>
<label class="upload-box" for="videoUpload">
<div style="font-size:24px; margin-bottom:6px;">🎥</div>
<div style="font-size:13px;">برای آپلود ویدیو کوتاه کلیک کنید</div>
<input type="file" id="videoUpload" accept="video/*" onchange="uploadTeaserVideo(event)" style="display:none;">
</label>
</div>

<button class="btn btn-outline" onclick="handleLogout()" style="margin-top:20px;">🚪 خروج از حساب</button>
</div>
<script>
// ================================================================
// چاره‌ساز | پنل متخصص | بخش ۳: منطق اصلی
// ================================================================

// تنظیمات اتصال به Supabase
const SUPABASE_URL = 'https://gdnvrlzpbnnulpncbyed.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkbnZybHpwYm5udWxwbmNieWVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjMzNzcsImV4cCI6MjEwNzgzOTM3N30.3nRUrAMjpyL937lM1wDVjWgDCDykkZYfCa8QKyFFUIY';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

// ================================================================
// سیستم پیام (Toast)
// ================================================================
function showToast(msg, type = 'info', duration = 3000) {
const c = document.getElementById('toastContainer');
if (!c) return;
const t = document.createElement('div');
t.className = 'toast toast-' + type;
const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
t.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
c.appendChild(t);
setTimeout(() => {
t.style.opacity = '0';
t.style.transform = 'translateY(-20px)';
setTimeout(() => t.remove(), 300);
}, duration);
}

// ================================================================
// مدیریت تب‌های ورود و ثبت‌نام
// ================================================================
function switchTab(tab) {
document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.remove('active'));
const btn = document.querySelector('.auth-tabs button[data-tab="' + tab + '"]');
if (btn) btn.classList.add('active');
document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
const form = document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm');
if (form) form.classList.add('active');
}

// ================================================================
// ورود متخصص
// ================================================================
async function handleLogin(e) {
e.preventDefault();
const email = document.getElementById('loginEmail').value.trim();
const pass = document.getElementById('loginPassword').value;
const btn = document.getElementById('loginBtn');

if (!email || !pass) { showToast('ایمیل و رمز عبور الزامی است', 'error'); return; }

btn.textContent = 'در حال ورود...';
btn.disabled = true;

try {
const { data, error } = await db.auth.signInWithPassword({ email, password: pass });

if (error) {
showToast('ایمیل یا رمز عبور اشتباه است', 'error');
btn.textContent = 'ورود به پنل';
btn.disabled = false;
return;
}

const { data: profile, error: profileError } = await db
.from('profiles')
.select('*')
.eq('id', data.user.id)
.single();

if (profileError || !profile) {
showToast('خطا در دریافت اطلاعات پروفایل', 'error');
btn.textContent = 'ورود به پنل';
btn.disabled = false;
return;
}

if (profile.role !== 'expert' && profile.role !== 'both') {
showToast('شما دسترسی به پنل متخصص ندارید', 'error');
await db.auth.signOut();
btn.textContent = 'ورود به پنل';
btn.disabled = false;
return;
}

currentUser = profile;
showToast('خوش آمدید ' + currentUser.name, 'success');
showDashboard();

} catch (err) {
console.error(err);
showToast('خطای سیستمی. لطفاً دوباره تلاش کنید.', 'error');
} finally {
btn.textContent = 'ورود به پنل';
btn.disabled = false;
}
}

// ================================================================
// ثبت‌نام متخصص
// ================================================================
async function handleRegister(e) {
e.preventDefault();
const name = document.getElementById('registerName').value.trim();
const email = document.getElementById('registerEmail').value.trim();
const pass = document.getElementById('registerPassword').value;
const confirm = document.getElementById('registerPasswordConfirm').value;
const btn = document.getElementById('registerBtn');

if (!name || name.length < 3) { showToast('نام کامل الزامی است', 'error'); return; }
if (!pass || pass.length < 6) { showToast('رمز عبور حداقل ۶ کاراکتر است', 'error'); return; }
if (pass !== confirm) { showToast('رمز عبور مطابقت ندارد', 'error'); return; }

btn.textContent = 'در حال ثبت‌نام...';
btn.disabled = true;

try {
const { data, error } = await db.auth.signUp({ email, password: pass });

if (error) {
showToast(error.message === 'User already registered' ? 'این ایمیل قبلاً ثبت شده است' : error.message, 'error');
btn.textContent = 'ثبت‌نام';
btn.disabled = false;
return;
}

const { error: insertError } = await db.from('profiles').insert([
{ 
id: data.user.id, 
name: name, 
email: email, 
role: 'expert',
gallery: [],
teaser_video_url: null
}
]);

if (insertError) {
showToast('خطا در ذخیره اطلاعات: ' + insertError.message, 'error');
btn.textContent = 'ثبت‌نام';
btn.disabled = false;
return;
}

const { data: profile } = await db.from('profiles').select('*').eq('id', data.user.id).single();
currentUser = profile;

showToast('ثبت‌نام موفق! خوش آمدید ' + name, 'success');
showDashboard();

} catch (err) {
console.error(err);
showToast('خطای سیستمی', 'error');
} finally {
btn.textContent = 'ثبت‌نام';
btn.disabled = false;
}
}

// ================================================================
// خروج از حساب
// ================================================================
async function handleLogout() {
try { await db.auth.signOut(); } catch (e) {}
currentUser = null;
showToast('خارج شدید', 'info');
location.reload();
}

// ================================================================
// نمایش داشبورد (با رفع باگ)
// ================================================================
function showDashboard() {
document.getElementById('authPage').style.display = 'none';
document.getElementById('dashboardPage').style.display = 'block';

const hour = new Date().getHours();
let greeting = 'سلام';
if (hour < 12) greeting = 'صبح بخیر ☀️';
else if (hour < 17) greeting = 'ظهر بخیر 🌤️';
else if (hour < 20) greeting = 'عصر بخیر 🌆';
else greeting = 'شب بخیر 🌙';

document.getElementById('greetingText').textContent = greeting;
document.getElementById('welcomeName').textContent = 'خوش آمدید ' + currentUser.name;
document.getElementById('userAvatar').textContent = currentUser.name.charAt(0);

// رندر کردن گالری و فیلم (این خطوط باگ قبلی رو رفع می‌کنند)
renderGallery();
renderVideo();
}
</script>
<script>
// ================================================================
// چاره‌ساز | پنل متخصص | بخش ۴: گالری، فیلم و راه‌اندازی
// ================================================================

// ================================================================
// نمایش گالری از دیتابیس
// ================================================================
function renderGallery() {
const container = document.getElementById('galleryGrid');
if (!container) return;
const gallery = currentUser.gallery || [];

if (gallery.length === 0) {
container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:16px; color:var(--text-muted); font-size:12px;">هنوز عکسی آپلود نکردید</div>`;
return;
}

container.innerHTML = gallery.map((url, i) => `
<div class="gallery-item">
<img src="${url}" alt="نمونه‌کار">
<button class="delete-btn" onclick="deleteGalleryImage(${i})">✕</button>
</div>
`).join('');
}

// ================================================================
// آپلود عکس به Storage
// ================================================================
async function uploadGalleryImage(event) {
const file = event.target.files[0];
if (!file) return;

if (file.size > 2 * 1024 * 1024) {
showToast('حجم عکس باید کمتر از ۲ مگابایت باشد', 'error');
return;
}

const gallery = currentUser.gallery || [];
if (gallery.length >= 6) {
showToast('حداکثر ۶ عکس می‌توانید آپلود کنید', 'warning');
return;
}

showToast('در حال آپلود عکس...', 'info');

try {
const fileExt = file.name.split('.').pop();
const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;

const { data, error } = await db.storage
.from('avatars')
.upload(fileName, file);

if (error) {
showToast('خطا در آپلود: ' + error.message, 'error');
return;
}

const { data: urlData } = db.storage.from('avatars').getPublicUrl(fileName);
const newGallery = [...gallery, urlData.publicUrl];

const { error: updateError } = await db
.from('profiles')
.update({ gallery: newGallery })
.eq('id', currentUser.id);

if (updateError) {
showToast('خطا در ذخیره اطلاعات', 'error');
return;
}

currentUser.gallery = newGallery;
renderGallery();
showToast('عکس با موفقیت آپلود شد', 'success');

} catch (err) {
console.error(err);
showToast('خطای سیستمی', 'error');
}
}

// ================================================================
// حذف عکس از گالری
// ================================================================
async function deleteGalleryImage(index) {
const gallery = currentUser.gallery || [];
const newGallery = gallery.filter((_, i) => i !== index);

const { error } = await db
.from('profiles')
.update({ gallery: newGallery })
.eq('id', currentUser.id);

if (error) {
showToast('خطا در حذف', 'error');
return;
}

currentUser.gallery = newGallery;
renderGallery();
showToast('عکس حذف شد', 'info');
}

// ================================================================
// نمایش فیلم
// ================================================================
function renderVideo() {
const container = document.getElementById('videoPreview');
if (!container) return;

if (!currentUser.teaser_video_url) {
container.innerHTML = '';
return;
}

container.innerHTML = `
<video controls style="width:100%; border-radius:12px; max-height:200px;">
<source src="${currentUser.teaser_video_url}" type="video/mp4">
مرورگر شما از ویدیو پشتیبانی نمی‌کند
</video>
`;
}

// ================================================================
// آپلود فیلم تیزر
// ================================================================
async function uploadTeaserVideo(event) {
const file = event.target.files[0];
if (!file) return;

if (file.size > 10 * 1024 * 1024) {
showToast('حجم فیلم باید کمتر از ۱۰ مگابایت باشد', 'error');
return;
}

showToast('در حال آپلود فیلم... لطفاً صبر کنید', 'info');

try {
const fileExt = file.name.split('.').pop();
const fileName = `${currentUser.id}/teaser_${Date.now()}.${fileExt}`;

const { data, error } = await db.storage
.from('videos')
.upload(fileName, file);

if (error) {
showToast('خطا در آپلود: ' + error.message, 'error');
return;
}

const { data: urlData } = db.storage.from('videos').getPublicUrl(fileName);

const { error: updateError } = await db
.from('profiles')
.update({ teaser_video_url: urlData.publicUrl })
.eq('id', currentUser.id);

if (updateError) {
showToast('خطا در ذخیره اطلاعات', 'error');
return;
}

currentUser.teaser_video_url = urlData.publicUrl;
renderVideo();
showToast('فیلم با موفقیت آپلود شد', 'success');

} catch (err) {
console.error(err);
showToast('خطای سیستمی', 'error');
}
}

// ================================================================
// راه‌اندازی اولیه و بررسی نشست
// ================================================================
async function init() {
const { data: { session } } = await db.auth.getSession();

if (session) {
const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
if (profile && (profile.role === 'expert' || profile.role === 'both')) {
currentUser = profile;
showDashboard();
} else {
document.getElementById('authPage').style.display = 'flex';
document.getElementById('dashboardPage').style.display = 'none';
}
} else {
document.getElementById('authPage').style.display = 'flex';
document.getElementById('dashboardPage').style.display = 'none';
}
}

// اجرای اولیه
init();
</script>
