<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
--primary: #f97316;
--primary-dark: #ea580c;
--accent: #8b5cf6;
--gold: #f59e0b;
--green: #10b981;
--blue: #3b82f6;
--red: #ef4444;
--bg1: #0a0612;
--bg2: #1a0f2e;
--bg3: #0f1a3d;
--glass: rgba(255,255,255,0.06);
--glass-border: rgba(255,255,255,0.1);
--text: #ffffff;
--text-muted: rgba(255,255,255,0.55);
--font: 'Vazirmatn', sans-serif;
--font-mult: 1;
}
html[data-theme="light"] {
--bg1: #f5f7fa; --bg2: #e0e7ff; --bg3: #f0f4ff;
--glass: rgba(255,255,255,0.75); --glass-border: rgba(0,0,0,0.08);
--text: #1a1a2e; --text-muted: rgba(26,26,46,0.6);
}
html[data-font="small"] { --font-mult: 0.85; }
html[data-font="medium"] { --font-mult: 1; }
html[data-font="large"] { --font-mult: 1.15; }
html[data-font="xlarge"] { --font-mult: 1.35; }
html, body {
font-family: var(--font);
font-size: calc(15px * var(--font-mult));
background: radial-gradient(circle at 20% 0%, #2a0a4a 0%, transparent 50%),
radial-gradient(circle at 80% 100%, #0f1a5d 0%, transparent 50%),
linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
background-attachment: fixed; min-height: 100vh; color: var(--text);
direction: rtl; overflow-x: hidden; position: relative; transition: background 0.4s, color 0.4s;
}
.glass {
background: var(--glass); backdrop-filter: blur(20px);
border: 1px solid var(--glass-border); border-radius: 20px;
box-shadow: 0 8px 32px rgba(0,0,0,0.3); padding: 18px; transition: all 0.35s;
}
.btn {
display: inline-flex; align-items: center; justify-content: center; gap: 8px;
padding: 13px 22px; border: none; border-radius: 14px; font-family: var(--font);
font-size: calc(15px * var(--font-mult)); font-weight: 700; cursor: pointer;
width: 100%; color: #fff; transition: all 0.3s;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(249,115,22,0.5); }
.btn-success { background: linear-gradient(135deg, var(--green), #059669); }
.btn-outline { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: var(--text); }
.input-group { margin-bottom: 16px; }
.input-group label { display: block; font-size: calc(13px * var(--font-mult)); font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.input-group input, .input-group select {
width: 100%; padding: 12px 16px; border: 1px solid rgba(255,255,255,0.12);
border-radius: 14px; background: rgba(255,255,255,0.05); color: var(--text);
font-family: var(--font); font-size: calc(15px * var(--font-mult)); outline: none; transition: all 0.3s;
}
.input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(249,115,22,0.15); }
.toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 460px; width: 92%; pointer-events: none; }
.toast { padding: 14px 20px; border-radius: 16px; color: #fff; font-size: calc(14px * var(--font-mult)); font-weight: 600; backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); pointer-events: auto; display: flex; align-items: center; gap: 10px; animation: slideDown 0.4s; border: 1px solid rgba(255,255,255,0.15); }
.toast-success { background: rgba(16,185,129,0.95); }
.toast-error { background: rgba(239,68,68,0.95); }
.toast-warning { background: rgba(245,158,11,0.95); }
.toast-info { background: rgba(59,130,246,0.95); }
@keyframes slideDown { 0% { opacity: 0; transform: translateY(-30px); } 100% { opacity: 1; transform: translateY(0); } }
.auth-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; position: relative; z-index: 1; }
.auth-box { width: 100%; max-width: 420px; background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); padding: 32px 26px; }
.auth-box .logo { text-align: center; margin-bottom: 32px; }
.auth-box .logo-icon { font-size: 64px; margin-bottom: 8px; display: inline-block; animation: bounce 2s infinite ease-in-out; }
.auth-box .logo h1 { font-size: calc(42px * var(--font-mult)); font-weight: 900; background: linear-gradient(135deg, #fff 0%, #fbbf24 50%, #f97316 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -2px; margin-bottom: 4px; }
.auth-box .logo p { color: var(--text-muted); font-size: calc(14px * var(--font-mult)); }
.auth-tabs { display: flex; gap: 6px; margin-bottom: 24px; background: rgba(255,255,255,0.04); border-radius: 16px; padding: 5px; }
.auth-tabs button { flex: 1; padding: 12px; border: none; border-radius: 12px; background: transparent; color: var(--text-muted); font-family: var(--font); font-size: calc(14px * var(--font-mult)); font-weight: 700; cursor: pointer; transition: all 0.3s; }
.auth-tabs button.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 15px rgba(249,115,22,0.4); }
.auth-form { display: none; }
.auth-form.active { display: block; }
.auth-footer { text-align: center; margin-top: 18px; color: var(--text-muted); font-size: calc(13px * var(--font-mult)); }
.auth-footer a { color: var(--primary); cursor: pointer; font-weight: 700; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
</style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

<!-- صفحه ورود -->
<div class="auth-page" id="authPage">
<div class="auth-box">
<div class="logo">
<div class="logo-icon">🌐</div>
<h1>چاره‌ساز</h1>
<p>سوپر اپلیکیشن ملی</p>
</div>

<div class="auth-tabs">
<button class="active" data-tab="login" onclick="switchTab('login')">ورود</button>

<form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">

<label>ایمیل (مدیر یا کاربر)</label>
<input type="email" id="loginEmail" placeholder="example@mail.com" required>
</div>

<label>رمز عبور</label>
<input type="password" id="loginPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6">
</div>
<button type="submit" class="btn btn-primary" id="loginBtn">ورود به چاره‌ساز</button>
<div class="auth-footer">حساب ندارید؟ <a onclick="switchTab('register')">ثبت‌نام کنید</a></div>
</form>

<form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
<div class="input-group">
<label>نام کامل</label>
<input type="text" id="registerName" placeholder="نام و نام خانوادگی" required>
</div>
<div class="input-group">
<label>ایمیل</label>
<input type="email" id="registerEmail" placeholder="example@mail.com" required>
</div>
<div class="input-group">
<label>رمز عبور</label>
<input type="password" id="registerPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6">
</div>
<div class="input-group">
<label>تکرار رمز عبور</label>
<input type="password" id="registerPasswordConfirm" placeholder="تکرار رمز" required>
</div>
<button type="submit" class="btn btn-success" id="registerBtn">ثبت‌نام</button>
<div class="auth-footer">قبلاً ثبت‌نام کردید؟ <a onclick="switchTab('login')">وارد شوید</a></div>
</form>
</div>
</div>

<!-- صفحه انتخاب نقش -->
<div class="auth-page" id="rolePage" style="display:none;">
<div class="auth-box glass">
<div class="logo">
<div class="logo-icon">🎯</div>
<h1>نقش خود</h1>
<p>را انتخاب کنید</p>
</div>

<div style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px;">
<div class="role-card" data-role="customer" onclick="selectRoleCard('customer')" style="background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); border-radius:20px; padding:20px 12px; text-align:center; cursor:pointer;">
<span style="font-size:40px; display:block; margin-bottom:8px;">🛒</span>
<div style="font-size:15px; font-weight:700;">مشتری</div>
<div style="font-size:11px; color:var(--text-muted); margin-top:4px;">خدمات بگیرید</div>
</div>
<div class="role-card" data-role="expert" onclick="selectRoleCard('expert')" style="background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); border-radius:20px; padding:20px 12px; text-align:center; cursor:pointer;">
<span style="font-size:40px; display:block; margin-bottom:8px;">🔧</span>
<div style="font-size:15px; font-weight:700;">متخصص</div>
<div style="font-size:11px; color:var(--text-muted); margin-top:4px;">خدمات بدهید</div>
</div>
</div>
<button class="btn btn-primary" onclick="confirmRole()">تأیید و ادامه</button>
</div>
</div>

<!-- داشبورد -->
<div id="dashboardPage" style="display:none; padding:20px; max-width:480px; margin:0 auto;">
<div style="display:flex; justify-content:space-between; align-items:center; padding:14px 0 24px;">
<div>
<h2 style="font-size:26px; font-weight:900; background:linear-gradient(90deg, var(--text), var(--primary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">چاره‌ساز</h2>
<p id="dashGreeting" style="font-size:12px; color:var(--text-muted); margin-top:4px;">خوش آمدید</p>
</div>
<div style="width:48px; height:48px; border-radius:50%; background:linear-gradient(135deg, var(--primary), var(--accent)); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px;" id="dashAvatar">م</div>
</div>

<div style="background:linear-gradient(135deg, rgba(249,115,22,0.18), rgba(139,92,246,0.18)); border:1px solid rgba(249,115,22,0.3); border-radius:24px; padding:22px; margin-bottom:20px;">
<div style="font-size:20px; font-weight:800; color:var(--text);" id="dashWelcome">خوش آمدید</div>
<div style="font-size:13px; color:var(--text-muted); margin-top:8px;" id="dashDesc">سیستم آماده است</div>
</div>

<div style="font-size:14px; font-weight:700; color:var(--text-muted); margin-bottom:12px;">📱 پنل شما</div>
<div id="mainApps" style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px;"></div>

<button class="btn btn-outline" onclick="handleLogout()" style="margin-top:20px;">🚪 خروج از حساب</button>
</div>

<script>
// ================================================================
// پیکربندی Supabase
// ================================================================
const SUPABASE_URL = 'https://gdnvrlzpbnnulpncbyed.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkbnZybHpwYm5udWxwbmNieWVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjMzNzcsImV4cCI6MjEwNzgzOTM3N30.3nRUrAMjpyL937lM1wDVjWgDCDykkZYfCa8QKyFFUIY';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let selectedRole = 'customer';
</script>
<script>
// ================================================================
// چاره‌ساز | هسته اصلی | JavaScript
// ================================================================

// ================================================================
// Toast
// ================================================================
function showToast(msg, type = 'info', duration = 3000) {
const c = document.getElementById('toastContainer');
if (!c) return;
const t = document.createElement('div');
t.className = 'toast toast-' + type;
const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
t.innerHTML = (icons[type] || 'ℹ️') + ' ' + msg;
c.appendChild(t);
setTimeout(() => {
t.style.opacity = '0';
t.style.transform = 'translateY(-20px)';
setTimeout(() => t.remove(), 300);
}, duration);
}

// ================================================================
// مدیریت تب‌ها
// ================================================================
function switchTab(tab) {
document.querySelectorAll('.auth-tabs button').forEach(b => b.classList.remove('active'));
const btn = document.querySelector('.auth-tabs button[data-tab="' + tab + '"]');
if (btn) btn.classList.add('active');
document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
const form = document.getElementById(tab === 'login' ? 'loginForm' : 'registerForm');
if (form) form.classList.add('active');
}

// ================================================================
// ورود با Supabase
// ================================================================
async function handleLogin(e) {
e.preventDefault();
const email = document.getElementById('loginEmail').value.trim();
const pass = document.getElementById('loginPassword').value;
const btn = document.getElementById('loginBtn');

if (!email || !pass) { showToast('ایمیل و رمز عبور الزامی است', 'error'); return; }

btn.textContent = 'در حال ورود...';
btn.disabled = true;

// ورود مدیر (با رمز خاص)
if (email === 'admin@charesaz.com' && pass === '0371666961') {
localStorage.setItem('chare_admin_session', '1');
showToast('خوش آمدید مدیر', 'success');
showDashboard({ email: 'admin@charesaz.com', role: 'admin', name: 'مدیر کل' });
btn.textContent = 'ورود به چاره‌ساز';
btn.disabled = false;
return;
}

try {
const { data, error } = await db.auth.signInWithPassword({ email, password: pass });

if (error) {
showToast(error.message === 'Invalid login credentials' ? 'ایمیل یا رمز عبور اشتباه است' : error.message, 'error');
btn.textContent = 'ورود به چاره‌ساز';
btn.disabled = false;
return;
}

// دریافت اطلاعات کاربر از دیتابیس
const { data: profile, error: profileError } = await db
.from('profiles')
.select('*')
.eq('id', data.user.id)
.single();

if (profileError || !profile) {
showToast('خطا در دریافت اطلاعات کاربر. لطفاً با پشتیبانی تماس بگیرید.', 'error');
btn.textContent = 'ورود به چاره‌ساز';
btn.disabled = false;
return;
}

// بررسی نقش و نمایش داشبورد
localStorage.setItem('chare_user_session', JSON.stringify(profile));
showToast('خوش آمدید ' + profile.name, 'success');
showDashboard(profile);

} catch (err) {
console.error(err);
showToast('خطای سیستمی. لطفاً دوباره تلاش کنید.', 'error');
} finally {
btn.textContent = 'ورود به چاره‌ساز';
btn.disabled = false;
}
}

// ================================================================
// ثبت‌نام با Supabase
// ================================================================
async function handleRegister(e) {
e.preventDefault();
const name = document.getElementById('registerName').value.trim();
const email = document.getElementById('registerEmail').value.trim();
const pass = document.getElementById('registerPassword').value;
const confirm = document.getElementById('registerPasswordConfirm').value;
const btn = document.getElementById('registerBtn');

if (!name || name.length < 3) { showToast('نام کامل الزامی است', 'error'); return; }
if (!email) { showToast('ایمیل الزامی است', 'error'); return; }
if (!pass || pass.length < 6) { showToast('رمز عبور حداقل ۶ کاراکتر است', 'error'); return; }
if (pass !== confirm) { showToast('رمز عبور مطابقت ندارد', 'error'); return; }

btn.textContent = 'در حال ثبت‌نام...';
btn.disabled = true;

try {
// ثبت‌نام در سیستم احراز هویت
const { data, error } = await db.auth.signUp({ email, password: pass });

if (error) {
showToast(error.message === 'User already registered' ? 'این ایمیل قبلاً ثبت شده است' : error.message, 'error');
btn.textContent = 'ثبت‌نام';
btn.disabled = false;
return;
}

// ذخیره موقت اطلاعات برای انتخاب نقش
window.__tempRegister = { id: data.user.id, name, email };

// نمایش صفحه انتخاب نقش
document.getElementById('authPage').style.display = 'none';
document.getElementById('rolePage').style.display = 'flex';
showToast('حالا نقش خود را انتخاب کنید', 'info');

} catch (err) {
console.error(err);
showToast('خطای سیستمی. لطفاً دوباره تلاش کنید.', 'error');
} finally {
btn.textContent = 'ثبت‌نام';
btn.disabled = false;
}
}

// ================================================================
// انتخاب نقش و ذخیره در دیتابیس
// ================================================================
function selectRoleCard(role) {
selectedRole = role;
document.querySelectorAll('.role-card').forEach(c => {
if (c.dataset.role === role) {
c.style.border = '2px solid var(--primary)';
c.style.background = 'linear-gradient(135deg, rgba(249,115,22,0.2), rgba(139,92,246,0.15))';
} else {
c.style.border = '2px solid rgba(255,255,255,0.1)';
c.style.background = 'rgba(255,255,255,0.05)';
}
});
}

async function confirmRole() {
const temp = window.__tempRegister;
if (!temp) {
showToast('خطا: اطلاعات ثبت‌نام یافت نشد', 'error');
return;
}

if (!selectedRole) {
showToast('لطفاً یک نقش انتخاب کنید', 'error');
return;
}

try {
// ذخیره پروفایل در دیتابیس
const { error } = await db.from('profiles').insert([
{ id: temp.id, name: temp.name, email: temp.email, role: selectedRole }
]);

if (error) {
showToast('خطا در ذخیره اطلاعات: ' + error.message, 'error');
return;
}

// ذخیره در LocalStorage
const userProfile = { id: temp.id, name: temp.name, email: temp.email, role: selectedRole };
localStorage.setItem('chare_user_session', JSON.stringify(userProfile));
window.__tempRegister = null;

showToast('ثبت‌نام موفق! خوش آمدید ' + temp.name, 'success');
showDashboard(userProfile);

} catch (err) {
console.error(err);
showToast('خطای سیستمی', 'error');
}
}

// ================================================================
// خروج
// ================================================================
async function handleLogout() {
try {
await db.auth.signOut();
} catch (e) {}
localStorage.removeItem('chare_user_session');
localStorage.removeItem('chare_admin_session');
showToast('خارج شدید', 'info');
location.reload();
}
</script>
<script>
// ================================================================
// چاره‌ساز | هسته اصلی | داشبورد و تنظیمات
// ================================================================

// ================================================================
// نمایش داشبورد
// ================================================================
function showDashboard(user) {
document.getElementById('authPage').style.display = 'none';
document.getElementById('rolePage').style.display = 'none';
document.getElementById('dashboardPage').style.display = 'block';

const hour = new Date().getHours();
let greeting = 'سلام';
if (hour < 12) greeting = 'صبح بخیر ☀️';
else if (hour < 17) greeting = 'ظهر بخیر 🌤️';
else if (hour < 20) greeting = 'عصر بخیر 🌆';
else greeting = 'شب بخیر 🌙';

document.getElementById('dashGreeting').textContent = greeting;
document.getElementById('dashWelcome').textContent = 'خوش آمدید ' + user.name + ' 👋';
document.getElementById('dashAvatar').textContent = user.name.charAt(0);

let desc = 'عزیز، امروز آماده دریافت چه خدمتی هستی؟';
if (user.role === 'admin') desc = 'مدیر عزیز، امروز آماده نظارت هستید؟';
else if (user.role === 'expert') desc = 'متخصص عزیز، امروز آماده خدمات هستید؟';
else if (user.role === 'both') desc = 'هم مشتری، هم متخصص — امروز چه کاری داری؟';
document.getElementById('dashDesc').textContent = desc;

renderMainApps(user);
}

// ================================================================
// فیلتر پنل بر اساس نقش (هر کس فقط پنل خودش)
// ================================================================
function renderMainApps(user) {
const container = document.getElementById('mainApps');
if (!container) return;

let apps = [];

if (user.role === 'admin') {
apps = [
{ name: 'پنل مدیریت', icon: '👑', url: 'modiriat.html' }
];
} else if (user.role === 'expert') {
apps = [
{ name: 'پنل متخصص', icon: '🔧', url: 'motakhasseh.html' }
];
} else if (user.role === 'both') {
apps = [
{ name: 'پنل مشتری', icon: '🛒', url: 'moshtari.html' },
{ name: 'پنل متخصص', icon: '🔧', url: 'motakhasseh.html' }
];
} else {
apps = [
{ name: 'پنل مشتری', icon: '🛒', url: 'moshtari.html' }
];
}

container.innerHTML = apps.map(a => `
<a href="${a.url}" style="text-decoration:none; color:var(--text); background:var(--glass); border:1px solid var(--glass-border); border-radius:18px; padding:20px 12px; text-align:center; display:block; transition:all 0.3s;" onmouseover="this.style.transform='translateY(-4px)'" onmouseout="this.style.transform='translateY(0)'">
<div style="font-size:42px; margin-bottom:8px;">${a.icon}</div>
<div style="font-size:14px; font-weight:700;">${a.name}</div>
</a>
`).join('');
}

// ================================================================
// راه‌اندازی
// ================================================================
window.addEventListener('DOMContentLoaded', () => {
// بررسی نشست مدیر
if (localStorage.getItem('chare_admin_session')) {
showDashboard({ name: 'مدیر کل', role: 'admin', email: 'admin@charesaz.com' });
return;
}

// بررسی نشست کاربر
const userSession = localStorage.getItem('chare_user_session');
if (userSession) {
try {
const user = JSON.parse(userSession);
showDashboard(user);
} catch (e) {
localStorage.removeItem('chare_user_session');
}
}
});

console.log('🌐 هسته اصلی چاره‌ساز بارگذاری شد.');
</script>
</body>
</html>
